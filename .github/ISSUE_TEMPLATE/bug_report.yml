name: Bug report
description: Reportar um problema no porte
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues sobre o build Windows upstream devem ir para
        [SwagSoftware/KisakCOD](https://github.com/SwagSoftware/KisakCOD/issues).
        Aqui é específico do porte Switch / macOS / Linux.
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - macOS (ARM64)
        - macOS (x86_64)
        - Linux (ARM64)
        - Linux (x86_64)
        - Nintendo Switch (hardware)
        - Nintendo Switch (Ryujinx/Yuzu)
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / branch
      placeholder: "ex: port/switch @ abc1234"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado vs observado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
